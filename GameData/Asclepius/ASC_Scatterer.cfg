// Scatterer atmosphere for Asclepius (radius 220 km, atmosphere 22 km).
// Modeled on StockScattererConfigs Duna: thin, dusty, no ocean.
// Appends to the stock planets list; does not replace other bodies.
@Scatterer_planetsList:NEEDS[Scatterer]:FOR[Asclepius]
{
	@scattererCelestialBodies
	{
		Item
		{
			celestialBodyName = Asclepius
			transformName = Asclepius
			loadDistance = 100000000
			unloadDistance = 200000000
			hasOcean = False
			flatScaledSpaceModel = False
			usesCloudIntegration = True
			cloudIntegrationUsesScattererSunColors = False
			mainSunCelestialBody = Sun
			sunsUseIntensityCurves = False
			eclipseCasters
			{
				Item = Kruel
			}
		}
	}
}

Scatterer_atmosphere:NEEDS[Scatterer]
{
	Atmo
	{
		name = Asclepius
		atmosphereStartRadiusScale = 1
		// Slightly tighter scale heights than Duna for the 22 km ceiling.
		HR = 4
		HM = 2
		// Gray-tan dust: less red than Duna, a little more mie scatter.
		m_betaR = 0.032,0.026,0.018
		BETA_MSca = 0.006,0.006,0.0055
		m_mieG = 0.7
		averageGroundReflectance = 0.12
		multipleScattering = True
		godrayStrength = 0.8
		flattenScaledSpaceMesh = 0.2
		rimBlend = 20
		rimpower = 600
		specR = 2
		specG = 2
		specB = 2
		shininess = 50
		cloudColorMultiplier = 1
		cloudScatteringMultiplier = 0.2
		cloudSkyIrradianceMultiplier = 0
		volumetricsColorMultiplier = 1
		EVEIntegration_preserveCloudColors = False
		adjustScaledTexture = False
		scaledLandBrightnessAdjust = 1
		scaledLandContrastAdjust = 1
		scaledLandSaturationAdjust = 1
		scaledOceanBrightnessAdjust = 1
		scaledOceanContrastAdjust = 1
		scaledOceanSaturationAdjust = 1
		configPoints
		{
			Item
			{
				altitude = 0
				skyExposure = 0.2
				skyAlpha = 1
				skyExtinctionTint = 1
				scatteringExposure = 0.2
				extinctionThickness = 1
				postProcessAlpha = 1
				postProcessDepth = 0
				extinctionTint = 0
			}
		}
	}
}
