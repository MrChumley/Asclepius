// Asclepian sandstorms for Blackrack EVE-Redux / Volumetric Clouds Release 5.
// Dusty tan haze modeled on StockVolumetricClouds Duna-dust-scattered.
// Coverage map is the original CloudsAsc.dds (v1.5, 2048x1024 equirectangular).
// Detail, UV noise, and dust particles come from the V5 stock pack.
EVE_CLOUDS:NEEDS[EnvironmentalVisualEnhancements]
{
	OBJECT
	{
		name = ASC-sandstorm
		body = Asclepius
		altitude = 3500
		detailSpeed = 0,6,0
		speed = 0,10,0
		settings
		{
			_DetailTex = StockVolumetricClouds/Clouds/Textures/PluginData/detail1
			_DetailScale = 30
			_UVNoiseTex = StockVolumetricClouds/Clouds/Textures/PluginData/uvnoise1
			_UVNoiseScale = 0.2
			_Color = 135,133,122,180
			_Lambertian = 0.5
			_MainTex
			{
				value = Asclepius/Textures/PluginData/CloudsAsc
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			_FlowMap
			{
			}
		}
		layerRaymarchedVolumeV5
		{
			upwardsCloudSpeed = 8
			// Fade to the 2D layer before a typical 49 km scout orbit
			// so the storms still read from orbit without a hard pop.
			scaledFadeStartAltitude = 18000
			scaledFadeEndAltitude = 40000
			color = 135,133,122,255
			skylightMultiplier = 0.2
			noise
			{
				worley
				{
					brightness = 1.4
					octaves = 3
				}
			}
			coverageMap
			{
				value = Asclepius/Textures/PluginData/CloudsAsc
				type = AlphaMap
				alphaMask = ALPHAMAP_R
			}
			raymarchingSettings
			{
				adaptiveStepSizeFactor = 0.01
				baseStepSize = 300
				maxStepSize = 1000
				lightMarchDistance = 0
				lightMarchSteps = 0
			}
			cloudTypes
			{
				Item
				{
					typeName = Dust
					minAltitude = -20
					maxAltitude = 8500
					interpolateCloudHeights = true
					baseNoiseTiling = 30000
					density = 0.001
					ambientVolume = 2
					coverageCurve
					{
						key = 0.00321579 1 -0.03297058 -0.03297058
						key = 0.02634327 1 0.111055 0.111055
						key = 0.3164966 0.7820052 -1.475057 -1.475057
						key = 0.9935608 0.01082993 -0.0226933 -0.0226933
					}
					densityCurve
					{
					}
				}
			}
			ambientSound
			{
				soundName = StockVolumetricClouds/Clouds/Sounds/DesertWind
			}
			particleField
			{
				particleFieldConfig = dust-Asclepius
			}
			lightVolumeSettings
			{
			}
			phaseFunctions
			{
			}
		}
		// Slow weather cycle, mostly on, no rapid flashing.
		timeSettings
		{
			unit = Hours
			duration = 40
			repeatInterval = 55
			fadeTime = 6
		}
		layer2D
		{
			shadowMaterial
			{
				_ShadowFactor = 1
			}
			macroCloudMaterial
			{
				_FalloffPow = 2
				_FalloffScale = 3
				_DetailDist = 2E-06
				_RimDist = 0.0001
				_RimDistSub = 1.01
				_InvFade = 0.008
			}
		}
	}
}

